name: VeloLab CI

on:
  push:
    branches: ["feat/local-training-dashboard"]
    paths:
      - "web/**"
      - ".github/workflows/velolab-ci.yml"
  pull_request:
    paths:
      - "web/**"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package.json
      - run: npm install --no-audit --no-fund
      - run: npm run build
